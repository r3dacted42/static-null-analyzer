<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Null Analyzer</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.css"
        integrity="sha512-uf06llspW44/LZpHzHT6qBOIVODjWtv4MxCricRxkzvopAlSWnTf6hpZTFxuuZcuNE9CBQhqE0Seu1CoRk84nQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/theme/lesser-dark.min.css"
        integrity="sha512-rcv22E/xD3QRYj/qKfy+mAlmCF45muYFRPBXJL7hv2F7Sn9k/VKK2070s0bhZOWOKbasRAhLdDCRFQFMMJEhug=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/ekmas/cs16.css@main/css/cs16.min.css">

    <style>
        body {
            padding: 0.5rem;
            max-width: 800px;
            margin: auto;
            margin: 0 max(0px, round(50vw - (800px / 2), 1px));
        }

        .gap {
            margin: 0.5rem 0;
        }

        .CodeMirror {
            height: 24rem;
        }

        .cfg-container {
            position: relative;
            width: 100%;
            height: 24rem;
            background-color: #3e4637;
            border: 1px solid;
            border-color: #292c21 #8c9284 #8c9284 #292c21;
            overflow: auto;

            #cfg-img {
                max-width: 100%;
            }

            #cfg-placeholder {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>C/C++ Static Null Ptr Analyzer</h1>
        <hr class="cs-hr">
    </header>

    <main>
        <p class="gap">Enter the code to analyze below:</p>

        <textarea id="code-text">void test_loop() {
    int* p = nullptr;
    for (int i = 0; i < 10; i++) {
        if (i > 5) {
            p = new int;
        }
        *p = i; // Potential null dereference
    }
}</textarea>

        <p class="gap">
            <input class="cs-input" id="func-name" placeholder="function_name" value="test_loop" type="text">
            <button id="analyze-btn" class="cs-btn">Analyze</button>
        </p>

        <div class="cfg-container">
            <img id="cfg-img">
            <span id="cfg-placeholder">CFG</span>
        </div>

        <dialog id="err-dialog" class="cs-dialog">
            <form method="dialog">
                <div class="heading">
                    <div class="wrapper">
                        <div class="icon"></div>
                        <p class="text">Error</p>
                    </div>
                    <button class="cs-btn close"></button>
                </div>
                <div id="err-msg" class="content">
                </div>
                <menu class="footer-btns">
                    <button class="cs-btn">OK</button>
                </menu>
            </form>
        </dialog>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.js"
        integrity="sha512-8RnEqURPUc5aqFEN04aQEiPlSAdE0jlFS/9iGgUyNtwFnSKCXhmB6ZTNl7LnDtDWKabJIASzXrzD0K+LYexU9g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/clike/clike.min.js"
        integrity="sha512-l8ZIWnQ3XHPRG3MQ8+hT1OffRSTrFwrph1j1oc1Fzc9UKVGef5XN9fdO0vm3nW0PRgQ9LJgck6ciG59m69rvfg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script>
        const editor = CodeMirror.fromTextArea(document.getElementById("code-text"), {
            lineNumbers: true,
            mode: "text/x-c++src",
            theme: "lesser-dark",
            indentUnit: 4
        });

        const funcName = document.getElementById("func-name");
        const analyzeBtn = document.getElementById("analyze-btn");
        const cfgImg = document.getElementById("cfg-img");
        const cfgPlaceholder = document.getElementById("cfg-placeholder");
        const errDialog = document.getElementById("err-dialog");
        const errMsg = document.getElementById("err-msg");

        analyzeBtn.addEventListener("click", async () => {
            analyzeBtn.disabled = true;
            analyzeBtn.textContent = "Analyzing...";
            const code = editor.getValue();
            const data = { code: code, func: funcName.value };
            try {
                const res = await fetch("/api/analyze", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    const imageBlob = await res.blob();
                    const imageUrl = URL.createObjectURL(imageBlob);
                    cfgImg.src = imageUrl;
                    cfgPlaceholder.style.display = 'none';
                } else {
                    const errorJson = await res.json();
                    let msg = `Error ${res.status}: ${errorJson.error}`;
                    if (errorJson.stderr) {
                        msg += `\n${errorJson.stderr}`;
                    }
                    errMsg.innerText = msg;
                    console.log(errorJson);
                    errDialog.showModal();
                }
            } catch (err) {
                errMsg.innerText = err;
                console.error(err);
                errDialog.showModal();
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.textContent = "Analyze";
            }
        });
